    <script>
      (function() {
        function shouldSuppress(msg, src, stack) {
          var str = ((msg || '') + ' ' + (src || '') + ' ' + (stack || '')).toLowerCase();
          return (
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1 ||
            str.indexOf('safari-extension://') !== -1 ||
            str.indexOf('chrome: call method') !== -1 ||
            str.indexOf('call method" timed out') !== -1 ||
            str.indexOf('resizeobserver loop') !== -1
          );
        }

        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message) || '';
          var src = event.filename || '';
          var stack = (event.error && event.error.stack) || '';
          if (shouldSuppress(msg, src, stack)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = reason ? (reason.message || String(reason)) : '';
          var stack = reason ? (reason.stack || '') : '';
          if (shouldSuppress(msg, '', stack)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
